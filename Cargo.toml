[workspace]
members = ["crates/core", "crates/protocol", "crates/asr-worker", "crates/audio", "crates/worker-supervisor", "crates/models", "crates/sensevoice", "crates/providers", "crates/license", "src-tauri"]
resolver = "2"
exclude = ["vendor/whisper-rs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
