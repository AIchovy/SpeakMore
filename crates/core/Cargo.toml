[package]
name = "speakmore-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
