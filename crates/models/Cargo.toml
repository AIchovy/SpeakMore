[package]
name = "speakmore-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
signing = ["dep:getrandom"]

[dependencies]
speakmore-protocol = { path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64 = "0.22"
ed25519-dalek = "2.2"
sha2 = "0.10"
semver = "1"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
getrandom = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "speakmore-model-catalog-sign"
path = "src/bin/sign.rs"
required-features = ["signing"]
